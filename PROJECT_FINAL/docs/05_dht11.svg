<text x="775.0" y="173.5" font-size="10" text-anchor="middle" fill="#37474f" font-weight="normal">START (LOW 18 ms) → WAIT</text>
<text x="775.0" y="187.5" font-size="10" text-anchor="middle" fill="#37474f" font-weight="normal">→ SYNC_L → SYNC_H</text>
<text x="775.0" y="201.5" font-size="10" text-anchor="middle" fill="#37474f" font-weight="normal">→ {DATA_SYNC → DATA_BIT</text>
<text x="775.0" y="215.5" font-size="10" text-anchor="middle" fill="#37474f" font-weight="normal">    → BIT_DEC} x 40</text>
<text x="775.0" y="229.5" font-size="10" text-anchor="middle" fill="#37474f" font-weight="normal">→ STOP → IDLE</text>
